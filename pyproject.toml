[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "deepmacro"
version = "0.1.0"
description = "宏观数据接口包：覆盖中国、美国、日本、韩国、台湾的宏观指标，直连各国统计局官方接口"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "deepmacro contributors" }]
keywords = ["macro", "economic-data", "statistics", "cpi", "ppi", "pmi", "china", "akshare"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "requests>=2.28",
    "pandas>=1.5",
    "beautifulsoup4>=4.11",
    "lxml>=4.9",
    "openpyxl>=3.1",
]

[project.urls]
Homepage = "https://github.com/385289865/deepmacro"
Documentation = "https://github.com/385289865/deepmacro#readme"

[project.optional-dependencies]
dev = ["pytest>=7.0"]
korea = ["playwright>=1.40"]

[tool.hatch.build.targets.wheel]
packages = ["deepmacro"]
